<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coleta de Água · Hemodiálise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f7; --card:#fff; --ink:#0f2329; --muted:#5b6f76; --line:#dbe4e6;
  --brand:#0a7570; --brand-ink:#fff; --brand-soft:#e3f2f1; --danger:#c0392b; --danger-soft:#fbeae8;
  --p:#7d8b90; --p-bg:#eef1f2; --f:#a86a12; --f-bg:#fcf1dc; --c:#2563a8; --c-bg:#e5eefa;
  --e:#6a44b8; --e-bg:#eee8fa; --l:#25804f; --l-bg:#e2f4e9;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:500;font-size:12px;opacity:.8}
.chip-user{background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:6px 12px;font-size:13px;color:#fff;cursor:pointer;max-width:45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:980px;margin:0 auto;padding:16px 14px 96px}
.banner{max-width:980px;margin:10px auto 0;padding:10px 14px;border-radius:10px;background:var(--f-bg);color:#6b4708;font-size:13px}
.banner.err{background:var(--danger-soft);color:var(--danger)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;width:100%;max-width:620px}
nav.bottom button{flex:1;background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brand);font-weight:600}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:15px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.stepper span{min-width:130px;text-align:center;font-weight:600}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0 4px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:10px}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.click{cursor:pointer}
.card.late{border-color:#e9b4ad;background:#fffafa}
.card .t{font-weight:700;font-size:16px}
.card .m{color:var(--muted);font-size:13px;margin-top:4px}
.card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-pendente{color:var(--p);background:var(--p-bg)} .s-frascos{color:var(--f);background:var(--f-bg)}
.s-coletado{color:var(--c);background:var(--c-bg)} .s-enviado{color:var(--e);background:var(--e-bg)}
.s-laudo{color:var(--l);background:var(--l-bg)} .s-late{color:var(--danger);background:var(--danger-soft)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tag.bad{background:var(--danger-soft);color:var(--danger)} .tag.ok{background:var(--l-bg);color:var(--l)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
table.grid{border-collapse:collapse;min-width:760px;width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;font-size:13px}
.grid th{color:var(--muted);font-weight:600;background:#fafcfc}
.grid th.cur{color:var(--brand)}
.grid td.h{text-align:left;padding-left:12px;font-weight:600;position:sticky;left:0;background:#fff;min-width:130px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid th.h{position:sticky;left:0;text-align:left;padding-left:12px}
.cell{width:34px;height:30px;border-radius:8px;border:0;cursor:pointer;font-weight:700;font-size:12px}
.cell.none{background:transparent;color:#c5d0d3}
.cell.none:hover{background:var(--bg);color:var(--muted)}
.cell.late{outline:2px solid var(--danger);outline-offset:-2px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(10,30,35,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-top:0}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fixed{padding:10px 12px;background:var(--bg);border-radius:10px;font-weight:600}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.months label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;cursor:pointer}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.foot .left{margin-right:auto}
.laudo{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.laudo a{color:var(--brand);font-weight:600;word-break:break-all}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 18px;max-width:520px;margin:10px auto}
.hero p{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.auth-tabs{display:flex;gap:6px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:16px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.auth-tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 0}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
.gbtn:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.umenu{position:fixed;top:58px;right:12px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(10,30,35,.18);min-width:230px;max-width:calc(100vw - 24px);overflow:hidden}
.umenu .who{padding:14px 16px;border-bottom:1px solid var(--line)}
.umenu .who b{display:block}
.umenu .who span{display:block;font-size:12px;color:var(--muted);word-break:break-all}
.umenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:13px 16px;text-align:left;cursor:pointer;font-weight:500}
.umenu button:hover{background:var(--bg)}
.umenu button.out{color:var(--danger);border-top:1px solid var(--line)}
.chip-user::after{content:' ▾';font-size:10px;opacity:.8}
.err{color:var(--danger);font-size:13px;margin:-4px 0 10px;min-height:1em}
</style>
</head>
<body>
<header class="top">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5S5 10.2 5 14.6A7 7 0 0 0 19 14.6C19 10.2 12 2.5 12 2.5Z" fill="#fff" fill-opacity=".9"/><path d="M9 15.5a3 3 0 0 0 3 3" stroke="#0a7570" stroke-width="1.8" stroke-linecap="round"/></svg>
  <h1>Coleta de Água<small>Máquinas de hemodiálise</small></h1>
  <button class="chip-user" id="userChip" data-act="userMenu" aria-haspopup="menu" aria-expanded="false" hidden></button>
</header>
<div class="umenu" id="userMenu" role="menu" hidden></div>
<div id="banner"></div>
<main id="view"><div class="spin"></div></main>
<nav class="bottom" id="nav" hidden><div class="in">
  <button data-act="nav" data-r="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Painel</button>
  <button data-act="nav" data-r="cronograma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Cronograma</button>
  <button data-act="nav" data-r="hospitais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V7l8-4 8 4v14"/><path d="M12 9v6M9 12h6M4 21h16"/></svg>Hospitais</button>
  <button data-act="nav" data-r="equipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6.1 4.4 1.6 5 4.3"/></svg>Equipe</button>
  <button data-act="nav" data-r="admin" id="navAdmin" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.7-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>Admin</button>
</div></nav>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Firebase
   (Console do Firebase → Configurações do projeto → Seus apps → Web)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyD9pLttRc-Jdlw1JhZKt3MdCEeGpaa8sYU",
  authDomain: "coleta-de-agua.firebaseapp.com",
  projectId: "coleta-de-agua",
  storageBucket: "coleta-de-agua.firebasestorage.app",
  messagingSenderId: "591598990352",
  appId: "1:591598990352:web:f4aaf0975f025d65a34695",
  measurementId: "G-SQVMRRMNGV"
};
/* E-mail(s) do administrador — o mesmo colocado nas regras do Firestore */
const ADMIN_EMAILS = ["gustavo.s.almeida@gmail.com"];
/* ===================================================================== */
const APP_VERSION = "1.6";   // versão do app (veja CHANGELOG.md)

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, sendEmailVerification, signOut, GoogleAuthProvider, signInWithPopup, signInWithRedirect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=MESES.map(m=>m.slice(0,3));
const STATUS=[
  {k:'pendente',l:'Pendente',s:'P'},
  {k:'frascos',l:'Frascos disponíveis',s:'F'},
  {k:'coletado',l:'Coletado',s:'C'},
  {k:'enviado',l:'Enviado ao laboratório',s:'E'},
  {k:'laudo',l:'Laudo anexado',s:'L'}];
const ST=Object.fromEntries(STATUS.map((s,i)=>[s.k,{...s,i}]));
const FUNCOES=['Gestão','Controle do sistema','Coleta','Frascos e laudos','Enfermagem (cobrança)','Outro'];
const ROUTES=['painel','cronograma','hospitais','equipe','admin','maquinas'];
const now=new Date(), CUR_M=now.getMonth()+1, CUR_Y=now.getFullYear();

const S={errCols:[],convChecked:false,convites:[],convUnsub:null,creating:false,uid:null,email:'',me:undefined,isAdmin:false,authMode:'login',
  hospitais:[],coletas:[],usuarios:[],maquinas:[],maqTipo:'hemodialise',maqHosp:'',fresh:{h:false,c:false,u:false,m:false},err:false,
  route:'painel',mes:CUR_M,ano:CUR_Y,anoCrono:CUR_Y,m:null,unsubs:[],meUnsub:null,phase:'loading'};

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=()=>new Date().toISOString();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtData=s=>s?s.split('-').reverse().join('/'):'';
const hosp=id=>S.hospitais.find(h=>h.id===id);
const usr=id=>S.usuarios.find(u=>u.id===id)||(id===S.uid?S.me:null);
const uname=id=>(usr(id)||{}).nome||'';
const hname=h=>h?(h.sigla?`${h.nome} (${h.sigla})`:h.nome):'Hospital removido';
const isLate=c=>(c.ano<CUR_Y||(c.ano===CUR_Y&&c.mes<CUR_M))&&(ST[c.status]||ST.pendente).i<2;
const pill=(k,txt)=>`<span class="pill s-${k}">${esc(txt||(ST[k]||ST.pendente).l)}</span>`;
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}

const configured=!String(firebaseConfig.apiKey).startsWith('COLE');
let auth,fs;
if(configured){const app=initializeApp(firebaseConfig);auth=getAuth(app);fs=getFirestore(app)}
const D=(col,id)=>doc(fs,col,id);

async function w(fn){
  try{await fn();return true}
  catch(e){
    const c=(e&&e.code)||'';
    if(c.includes('permission-denied'))toast('Sem permissão para essa ação.');
    else if(c.includes('unavailable'))toast('Sem conexão. Tente de novo.');
    else toast('Não foi possível salvar.');
    console.error(e);return false;
  }
}

/* ---------- autenticação ---------- */
const AUTH_ERR={
  'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.',
  'auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.',
  'auth/email-already-in-use':'Este e-mail já tem cadastro. Use "Entrar".','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
  'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.','auth/network-request-failed':'Sem conexão com a internet.',
  'auth/popup-closed-by-user':'Login com Google cancelado.','auth/cancelled-popup-request':'Login com Google cancelado.',
  'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (veja o passo 7).',
  'auth/account-exists-with-different-credential':'Este e-mail já tem cadastro com senha. Entre com e-mail e senha.',
  'auth/operation-not-allowed':'Login por e-mail não foi ativado no Firebase (veja o passo a passo).'};
const authMsg=e=>AUTH_ERR[e&&e.code]||'Não foi possível concluir. Tente novamente.';

function stopData(){S.unsubs.forEach(u=>u());S.unsubs=[];if(S.convUnsub){S.convUnsub();S.convUnsub=null}S.hospitais=[];S.coletas=[];S.usuarios=[];S.convites=[];S.maquinas=[];S.fresh={h:false,c:false,u:false,m:false}}
const isOwnerEmail=e=>ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(e);

let curUser=null;
if(configured)onAuthStateChanged(auth,user=>{curUser=user;startUser(user)});
function startUser(user){
  stopData();if(S.meUnsub){S.meUnsub();S.meUnsub=null}
  if(!user){S.uid=null;S.me=undefined;S.isAdmin=false;S.phase='auth';closeModal();render();return}
  S.uid=user.uid;S.verified=user.emailVerified;S.displayName=user.displayName||'';S.email=(user.email||'').toLowerCase();S.me=undefined;S.phase='loading';render();
  if(!user.emailVerified){S.phase='verificar';render();return}
  const owner=isOwnerEmail(S.email);S.convChecked=false;S.errCols=[];S.err=false;
  S.meUnsub=onSnapshot(D('usuarios',S.uid),snap=>{
    S.me=snap.exists()?{id:snap.id,...snap.data()}:null;
    if(!S.me){stopData();S.isAdmin=false;primeiroAcesso(owner);return}
    if(!owner&&!S.convChecked){S.convChecked=true;aplicarConvite()}
    S.isAdmin=owner||(S.me.aprovado===true&&S.me.papel==='admin');
    if(!(owner||S.me.aprovado===true)){S.phase='semAcesso';stopData();render();return}
    S.phase='app';if(!S.unsubs.length)startData();
    if(S.isAdmin&&!S.convUnsub)S.convUnsub=onSnapshot(collection(fs,'convites'),s=>{S.convites=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));render()},e=>console.error(e));
    if(!S.isAdmin&&S.convUnsub){S.convUnsub();S.convUnsub=null;S.convites=[]}
    if(!S.isAdmin&&(S.route==='admin'||S.route==='maquinas'))location.hash='#painel';
    render();
  },e=>{console.error(e);S.err=true;render()});
}
async function aplicarConvite(){
  // Se o administrador cadastrou (ou recadastrou) este e-mail, aplica função, hospital e permissão no usuário que já existe.
  try{
    const c=await getDoc(D('convites',S.email));if(!c.exists())return;
    const v=c.data();
    await updateDoc(D('usuarios',S.uid),{nome:v.nome||(S.me&&S.me.nome)||'',email:S.email,funcao:v.funcao||'',telefone:v.telefone||'',hospitalId:v.hospitalId||'',aprovado:true,papel:v.papel==='admin'?'admin':'membro',atualizadoEm:iso()});
    deleteDoc(D('convites',S.email)).catch(()=>{});
  }catch(e){console.error('convite',e)}
}
async function primeiroAcesso(owner){
  if(S.creating)return;S.creating=true;
  try{
    if(owner){await setDoc(D('usuarios',S.uid),{nome:S.displayName||S.email.split('@')[0],email:S.email,funcao:'Gestão',telefone:'',hospitalId:'',aprovado:true,papel:'admin',criadoEm:iso()});return}
    const c=await getDoc(D('convites',S.email));
    if(!c.exists()){S.phase='semConvite';render();return}
    const v=c.data();
    await setDoc(D('usuarios',S.uid),{nome:v.nome||S.displayName||'',email:S.email,funcao:v.funcao||'',telefone:v.telefone||'',hospitalId:v.hospitalId||'',aprovado:true,papel:v.papel==='admin'?'admin':'membro',criadoEm:iso()});
    deleteDoc(D('convites',S.email)).catch(()=>{});
  }catch(e){console.error(e);S.phase='semConvite';render()}
  finally{S.creating=false}
}

function startData(){
  const byNome=(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR');
  const sub=(col,key,sort)=>onSnapshot(collection(fs,col),s=>{
    S[col]=s.docs.map(d=>({id:d.id,...d.data()})).sort(sort);S.fresh[key]=true;render();
  },e=>{console.error(col,e);if(!S.errCols.includes(col))S.errCols.push(col);S.fresh[key]=true;S.err=true;render()});
  S.unsubs=[sub('maquinas','m',(a,b)=>String(a.numeroSerie||'').localeCompare(String(b.numeroSerie||''),'pt-BR')),sub('hospitais','h',byNome),sub('usuarios','u',byNome),sub('coletas','c',(a,b)=>(a.ano-b.ano)||(a.mes-b.mes))];
}

function render(){
  const v=$('#view'),nav=$('#nav'),chip=$('#userChip'),ban=$('#banner');
  ban.innerHTML=S.err?`<div class="banner err">Erro ao carregar os dados${S.errCols.length?' ('+S.errCols.map(c=>({hospitais:'hospitais',coletas:'coletas',usuarios:'usuários',maquinas:'máquinas'})[c]||c).join(', ')+')':''}. O Firebase recusou a leitura: confira se as regras da versão ${APP_VERSION} foram publicadas (Firestore → Regras → Publicar) e entre de novo.</div>`:'';
  nav.hidden=true;chip.hidden=true;if(S.phase!=='app')closeMenu();
  if(!configured){v.innerHTML=`<div class="hero"><h2>Falta configurar o Firebase</h2><p>Abra o arquivo <b>index.html</b>, cole os dados do seu projeto Firebase em <code>firebaseConfig</code> e seu e-mail em <code>ADMIN_EMAILS</code>. Veja o arquivo PASSO-A-PASSO.</p></div>`;return}
  if(S.phase==='loading'){v.innerHTML='<div class="spin"></div><p class="note" style="text-align:center">Carregando…</p>';return}
  if(S.phase==='auth'){v.innerHTML=authView();return}
  if(S.phase==='verificar'){v.innerHTML=verificarView();return}
  if(S.phase==='semConvite'||S.phase==='semAcesso'){v.innerHTML=semAcessoView();return}
  if((S.route==='admin'||S.route==='maquinas')&&!S.isAdmin)S.route='painel';
  nav.hidden=false;chip.hidden=false;chip.textContent=(S.me&&S.me.nome)||S.email;
  $('#navAdmin').hidden=!S.isAdmin;
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===(S.route==='maquinas'?'admin':S.route)));
  if(!(S.fresh.h&&S.fresh.c&&S.fresh.u&&S.fresh.m)&&!S.err){v.innerHTML='<div class="spin"></div>';return}
  v.innerHTML=({painel:painelView,cronograma:cronoView,hospitais:hospView,equipe:equipeView,admin:adminView,maquinas:maquinasView})[S.route]();
}

const ACT={
  nav:d=>{closeModal();location.hash='#'+d.r},
  close:()=>closeModal(),
  authMode:d=>{S.authMode=d.m;render()},
  sair:()=>{closeMenu();closeModal();signOut(auth)},
  userMenu:()=>{const m=$('#userMenu');if(!m.hidden){closeMenu();return}
    const me=S.me||{};
    m.innerHTML=`<div class="who"><b>${esc(me.nome||'')}</b><span>${esc(S.email)}</span>${S.isAdmin?'<span class="tag ok" style="margin-top:6px;display:inline-block">Administrador</span>':''}</div>
      ${S.isAdmin?'<button data-act="menuPerfil" role="menuitem">✏️ Meu cadastro</button>':''}
      <button data-act="menuEquipe" role="menuitem">👥 Equipe</button>
      <button class="out" data-act="sair" role="menuitem">⎋ Sair do sistema</button>`;
    m.hidden=false;$('#userChip').setAttribute('aria-expanded','true')},
  menuPerfil:()=>{closeMenu();if(S.isAdmin)perfilModal()},
  menuEquipe:()=>{closeMenu();location.hash='#equipe'},
  google:async(d,btn)=>{
    const prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
    btn.disabled=true;const er=$('#authErr');if(er)er.textContent='';
    try{await signInWithPopup(auth,prov)}
    catch(x){
      if(x&&x.code==='auth/popup-blocked'){try{await signInWithRedirect(auth,prov);return}catch(y){x=y}}
      if(er)er.textContent=authMsg(x);btn.disabled=false;
    }
  },
  reenviar:async()=>{try{await sendEmailVerification(auth.currentUser);toast('E-mail de confirmação enviado.')}catch(x){toast(authMsg(x))}},
  mes:d=>{let m=S.mes+Number(d.d),y=S.ano;if(m<1){m=12;y--}if(m>12){m=1;y++}S.mes=m;S.ano=y;render()},
  ano:d=>{S.anoCrono+=Number(d.d);render()},
  coleta:d=>coletaModal(d.id),
  novaColeta:d=>coletaModal(null,d.h,Number(d.m),S.anoCrono),
  hospital:d=>hospitalModal(d.id),
  hospDet:d=>hospDetalheModal(d.id),
  gerar:()=>gerarModal(),
  meuPerfil:()=>{if(S.isAdmin)perfilModal()},
  todosMeses:()=>document.querySelectorAll('.months input').forEach(i=>i.checked=true),
  convite:d=>conviteModal(d.id),
  maqTipo:d=>{S.maqTipo=d.t;render()},
  maquina:d=>maquinaModal(d.id),
  delMaquina:async(d,btn)=>{if(!S.m.confirm){S.m.confirm=true;btn.textContent='Confirmar exclusão';return}
    btn.disabled=true;if(await w(()=>deleteDoc(D('maquinas',S.m.id)))){closeModal();toast('Máquina excluída.')}else btn.disabled=false},
  editUsuario:d=>usuarioAdmModal(d.id),
  cancelarConvite:async(d,btn)=>{if(btn.dataset.ok!=='1'){btn.dataset.ok='1';btn.textContent='Confirmar';return}
    if(await w(()=>deleteDoc(D('convites',d.id))))toast('Cadastro cancelado.')},
  verifOk:async(d,btn)=>{btn.disabled=true;try{await curUser.reload();await curUser.getIdToken(true)}catch(x){}
    if(curUser&&curUser.emailVerified)startUser(curUser);else{toast('Ainda não confirmado. Abra o link do e-mail e tente de novo.');btn.disabled=false}},
  tentar:()=>{if(curUser)startUser(curUser)},
  papel:async d=>{const u=usr(d.id);if(u&&await w(()=>updateDoc(D('usuarios',d.id),{papel:u.papel==='admin'?'membro':'admin'})))toast('Permissão atualizada.')},
  remover:async(d,btn)=>{if(btn.dataset.ok!=='1'){btn.dataset.ok='1';btn.textContent='Confirmar';return}
    if(await w(()=>deleteDoc(D('usuarios',d.id))))toast('Acesso removido.')},
  avancar:async(d,btn)=>{
    const c=S.coletas.find(x=>x.id===d.id);if(!c)return;const i=(ST[c.status]||ST.pendente).i;if(i>=3)return coletaModal(c.id);
    const upd={status:STATUS[i+1].k,atualizadoPor:S.uid,atualizadoEm:iso()};if(upd.status==='coletado'&&!c.dataColeta)upd.dataColeta=today();
    btn.disabled=true;if(await w(()=>updateDoc(D('coletas',c.id),upd)))toast(`${hname(hosp(c.hospitalId))}: ${STATUS[i+1].l}`);btn.disabled=false;
  },
  delColeta:async(d,btn)=>{if(!S.m.confirm){S.m.confirm=true;btn.textContent='Confirmar exclusão';return}
    btn.disabled=true;if(await w(()=>deleteDoc(D('coletas',S.m.id)))){closeModal();toast('Coleta excluída.')}else btn.disabled=false},
  delHospital:async(d,btn)=>{const hid=S.m.id;const cs=S.coletas.filter(c=>c.hospitalId===hid);
    if(!S.m.confirm){S.m.confirm=true;btn.textContent=cs.length?`Confirmar (apaga ${cs.length} coleta${cs.length>1?'s':''})`:'Confirmar exclusão';return}
    btn.disabled=true;for(const c of cs){if(!await w(()=>deleteDoc(D('coletas',c.id)))){btn.disabled=false;return}}
    if(await w(()=>deleteDoc(D('hospitais',hid)))){closeModal();toast('Hospital excluído.')}else btn.disabled=false}
};

document.addEventListener('click',e=>{if(!e.target.closest('#userMenu')&&!e.target.closest('#userChip'))closeMenu()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t,e)}});

document.addEventListener('submit',async e=>{
  const form=e.target;e.preventDefault();const kind=form.dataset.form;if(!kind)return;
  const f=new FormData(form);const btn=form.querySelector('button:not([type=button])');const val=k=>String(f.get(k)||'').trim();
  const errEl=$('#authErr');const setErr=m=>{if(errEl)errEl.textContent=m};
  if(btn)btn.disabled=true;let ok=false;
  try{
  if(kind==='login'){
    try{await signInWithEmailAndPassword(auth,val('email'),String(f.get('senha')));ok=true}catch(x){setErr(authMsg(x))}
  }
  if(kind==='reset'){
    try{await sendPasswordResetEmail(auth,val('email'));ok=true;toast('Link enviado. Confira seu e-mail (e o spam).');S.authMode='login';render()}catch(x){setErr(authMsg(x))}
  }
  if(kind==='cadastro'){
    try{
      const cred=await createUserWithEmailAndPassword(auth,val('email'),String(f.get('senha')));
      sendEmailVerification(cred.user).catch(()=>{});ok=true;
    }catch(x){setErr(authMsg(x))}
  }
  if(kind==='convite'){
    const email=val('email').toLowerCase();const editing=S.m&&S.m.id;
    if(!editing&&S.usuarios.some(u=>(u.email||'').toLowerCase()===email))toast('Este e-mail já é de um usuário ativo. Use Editar em Usuários ativos para mudar função ou hospital.');
    else if(!editing&&S.convites.some(c=>c.id===email))toast('Este e-mail já está cadastrado (aguardando primeiro acesso).');
    else{
      ok=await w(()=>setDoc(D('convites',email),{nome:val('nome'),funcao:val('funcao'),telefone:val('telefone'),hospitalId:val('hospitalId'),papel:val('papel')==='admin'?'admin':'membro',criadoPor:S.uid,criadoEm:iso()}));
      if(ok){closeModal();toast(editing?'Cadastro atualizado.':'Usuário cadastrado. Envie o link do app para a pessoa.')}
    }
  }
  if(kind==='maquina'){
    const id=S.m.id||doc(collection(fs,'maquinas')).id;const old=S.maquinas.find(x=>x.id===id)||{};
    const serie=val('numeroSerie');
    if(S.maquinas.some(x=>x.id!==id&&String(x.numeroSerie||'').trim().toLowerCase()===serie.toLowerCase()))toast('Já existe uma máquina com esse código de série.');
    else{
      ok=await w(()=>setDoc(D('maquinas',id),{tipo:val('tipo')==='osmose'?'osmose':'hemodialise',marca:val('marca'),numeroSerie:serie,anoCompra:val('anoCompra')?Number(val('anoCompra')):'',hospitalId:val('hospitalId'),obs:val('obs'),criadoEm:old.criadoEm||iso(),atualizadoPor:S.uid,atualizadoEm:iso()}));
      if(ok){S.maqTipo=val('tipo')==='osmose'?'osmose':'hemodialise';closeModal();toast('Máquina salva.')}
    }
  }
  if(kind==='usuarioAdm'){
    ok=await w(()=>updateDoc(D('usuarios',S.m.id),{nome:val('nome'),funcao:val('funcao'),telefone:val('telefone'),hospitalId:val('hospitalId'),papel:val('papel')==='admin'?'admin':'membro',atualizadoEm:iso()}));
    if(ok){closeModal();toast('Usuário atualizado.')}
  }
  if(kind==='meuPerfil'){
    ok=await w(()=>updateDoc(D('usuarios',S.uid),{nome:val('nome'),funcao:val('funcao'),telefone:val('telefone'),hospitalId:val('hospitalId'),atualizadoEm:iso()}));
    if(ok){closeModal();toast('Cadastro salvo.')}
  }
  if(kind==='hospital'){
    const id=S.m.id||doc(collection(fs,'hospitais')).id;const old=hosp(id)||{};
    ok=await w(()=>setDoc(D('hospitais',id),{nome:val('nome'),sigla:val('sigla'),maquinas:val('maquinas')?Number(val('maquinas')):'',pontos:val('pontos'),enfermeiraId:val('enfermeiraId'),contato:val('contato'),obs:val('obs'),criadoEm:old.criadoEm||iso(),atualizadoEm:iso()}));
    if(ok){closeModal();toast('Hospital salvo.')}
  }
  if(kind==='coleta'){
    const c=S.m.id?S.coletas.find(x=>x.id===S.m.id):null;
    const hospitalId=c?c.hospitalId:val('hospitalId'),mes=c?c.mes:Number(val('mes')),ano=c?c.ano:Number(val('ano'));
    const id=c?c.id:`${hospitalId}_${ano}_${mes}`;
    if(!c&&S.coletas.some(x=>x.id===id)){toast('Já existe coleta para este hospital neste mês.')}
    else{
      let status=val('status')||'pendente';const laudoUrl=val('laudoUrl');
      if(laudoUrl&&ST[status].i<4&&!(c&&c.laudoUrl===laudoUrl))status='laudo';
      ok=await w(()=>setDoc(D('coletas',id),{hospitalId,mes,ano,status,responsavelId:val('responsavelId'),dataColeta:val('dataColeta'),resultado:val('resultado'),laudoUrl,obs:val('obs'),criadoEm:(c&&c.criadoEm)||iso(),atualizadoPor:S.uid,atualizadoEm:iso()}));
      if(ok){closeModal();toast('Coleta salva.')}
    }
  }
  if(kind==='gerar'){
    const hospitalId=val('hospitalId'),ano=Number(val('ano'));const meses=f.getAll('m').map(Number);
    if(!meses.length)toast('Marque pelo menos um mês.');
    else{let n=0;ok=true;
      for(const mes of meses){const id=`${hospitalId}_${ano}_${mes}`;if(S.coletas.some(x=>x.id===id))continue;
        if(!await w(()=>setDoc(D('coletas',id),{hospitalId,mes,ano,status:'pendente',responsavelId:'',dataColeta:'',resultado:'',laudoUrl:'',obs:'',criadoEm:iso(),atualizadoPor:S.uid,atualizadoEm:iso()}))){ok=false;break}n++}
      if(ok){S.anoCrono=ano;closeModal();toast(n?`${n} coleta${n>1?'s':''} criada${n>1?'s':''}.`:'Esses meses já estavam no cronograma.');render()}}
  }
  }finally{if(btn&&document.body.contains(btn))btn.disabled=false}
});

render();
</script>
</body>
